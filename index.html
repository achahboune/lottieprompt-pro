<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LottiePrompt Pro Demo</title>
<style>
body{font-family:Arial,Helvetica,sans-serif;margin:0;padding:20px;background:#f5f5f5;}
.container{max-width:800px;margin:auto;background:#fff;padding:20px;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,0.1);}
textarea{width:100%;height:80px;margin-bottom:10px;}
button{padding:10px 20px;background:#0066ff;color:#fff;border:none;border-radius:4px;cursor:pointer;}
#animation{margin-top:20px;width:200px;height:200px;}
</style>
</head>
<body>
<div class="container">
<h1>LottiePrompt Pro Demo</h1>
<p>Enter a short description and generate a Lottie animation.</p>
<textarea id="prompt" placeholder="e.g., a rotating blue circle"></textarea>
<br>
<button id="generateBtn">Generate</button>
<div id="animation"></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
<script>
const btn=document.getElementById('generateBtn');
const prompt=document.getElementById('prompt');
const animContainer=document.getElementById('animation');
let animInstance=null;
btn.addEventListener('click',()=>{
  const text=prompt.value.trim();
  if(!text){alert('Please enter a description');return;}
  fetch('http://localhost:8000/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:text})})
    .then(r=>r.json())
    .then(data=>{
      if(animInstance){animInstance.destroy();}
      animInstance=lottie.loadAnimation({container:animContainer,renderer:'svg',loop:true,autoplay:true,animationData:data.animation});
    })
    .catch(err=>{console.error(err);alert('Error generating animation');});
});
</script>
</body>
</html>
